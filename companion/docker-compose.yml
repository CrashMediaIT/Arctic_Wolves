# Arctic Wolves Video Companion Server
# Worker/integration service for the main Arctic Wolves application.
#
# Quick start:
#   1. Copy .env.example to .env and set ENCRYPTION_KEY (must match main app)
#   2. docker compose up -d
#   3. Visit http://localhost:5100 → Settings to generate an API key
#   4. Enter that API key in the main app's Game Plan Settings
#
# All other configuration (RustFS credentials, hardware acceleration, etc.)
# is managed through the companion's web UI and stored in an encrypted config
# file on the persistent volume.  No other environment variables are needed.
#
# To build locally instead of pulling from GHCR, uncomment "build" and comment "image":
#   build: .

services:
  companion:
    image: ghcr.io/crashmediait/arctic-wolves-companion:latest
    # build: .
    container_name: aw-video-companion
    restart: unless-stopped
    ports:
      - "5100:5100"
    volumes:
      - companion_config:/config  # Persistent encrypted config (survives updates)
    env_file:
      - .env                      # Only ENCRYPTION_KEY is required
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5100/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  companion_config:
