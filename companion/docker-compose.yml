# Arctic Wolves Video Companion Server
# CPU-only configuration
#
# NETWORKING NOTE:
# If the nginx container runs on a Docker network (e.g. from a separate
# docker-compose), connect the companion to the same network so nginx can
# reach it by container name instead of 127.0.0.1:
#
#   docker network connect <nginx_network> aw-video-companion
#
# Alternatively, uncomment the "networks" section below and set the
# external network name to match your nginx stack.

services:
  companion:
    build: .
    container_name: aw-video-companion
    restart: unless-stopped
    ports:
      - "5100:5100"
    volumes:
      - /videos:/videos          # Mount your NFS/SMB video share here
    environment:
      - API_KEY=${API_KEY:-changeme}
      - VIDEO_BASE_PATH=/videos
      - HW_ACCEL=auto
      - MAX_CONCURRENT_JOBS=2
      - COMPANION_PORT=5100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5100/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Uncomment to join the same Docker network as nginx:
    # networks:
    #   - nginx_network

# Uncomment to use an existing external Docker network shared with nginx:
# networks:
#   nginx_network:
#     external: true
#     name: <your_nginx_network_name>  # e.g. nginx_default
