# Arctic Wolves Video Companion Server
# CPU-only configuration
#
# Quick start:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose up -d
#
# To build locally instead of pulling from GHCR, uncomment "build" and comment "image":
#   build: .

services:
  companion:
    image: ghcr.io/crashmediait/arctic-wolves-companion:latest
    # build: .
    container_name: aw-video-companion
    restart: unless-stopped
    ports:
      - "5100:5100"
    volumes:
      - /videos:/videos          # Mount your NFS/SMB video share here
    environment:
      - TZ=${TZ:-America/Toronto}
      - API_KEY=${API_KEY:-changeme}
      - VIDEO_BASE_PATH=/videos
      - HW_ACCEL=auto
      - MAX_CONCURRENT_JOBS=2
      - COMPANION_PORT=5100
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=${S3_USE_SSL:-true}
      - S3_VERIFY_SSL=${S3_VERIFY_SSL:-false}
      - HLS_STAGING_PREFIX=${HLS_STAGING_PREFIX:-Images/videos/}
      - HLS_POLL_INTERVAL=${HLS_POLL_INTERVAL:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5100/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
