# Arctic Wolves Video Companion Server
# Worker/integration service for the main Arctic Wolves application.
#
# Quick start:
#   1. Set ENCRYPTION_KEY below (64-char hex string) — recommended for
#      consistent encryption across container recreations.  If omitted,
#      one is auto-generated and written to the persistent volume.
#   2. docker compose up -d
#   3. Visit http://localhost:5100 — the setup page appears on first run.
#   4. Create an admin account, configure S3/RustFS, generate an API key.
#   5. Enter the generated API key in the main app's Game Plan Settings.
#
# The ENCRYPTION_KEY env var is required.  All other configuration (admin
# account, API key, RustFS credentials, hardware acceleration) is managed
# through the companion web UI and stored in an encrypted config file on
# the persistent volume.
#
# To build locally instead of pulling from GHCR, uncomment "build" and comment "image":
#   build: .

services:
  companion:
    image: ghcr.io/crashmediait/arctic-wolves-companion:latest
    # build: .
    container_name: aw-video-companion
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}  # Recommended: 64-char hex string for config encryption
    volumes:
      - companion_config:/config  # Persistent: encrypted config file

volumes:
  companion_config:
