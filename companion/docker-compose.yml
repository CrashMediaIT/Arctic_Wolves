# Arctic Wolves Video Companion Server
# Worker/integration service for the main Arctic Wolves application.
#
# Quick start:
#   1. docker compose up -d
#   2. Visit http://localhost:5100 — the setup page appears on first run
#   3. Generate or paste an encryption key
#   4. Go to Settings → Generate API Key, then enter it in the main app
#
# No environment variables are required.  All configuration (encryption key,
# API key, RustFS credentials, hardware acceleration) is managed through the
# companion web UI and stored in an encrypted config file on the persistent
# volume.  The encryption key persists across container updates.
#
# To build locally instead of pulling from GHCR, uncomment "build" and comment "image":
#   build: .

services:
  companion:
    image: ghcr.io/crashmediait/arctic-wolves-companion:latest
    # build: .
    container_name: aw-video-companion
    restart: unless-stopped
    ports:
      - "5100:5100"
    volumes:
      - companion_config:/config  # Persistent: encryption key + encrypted config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5100/setup')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  companion_config:
