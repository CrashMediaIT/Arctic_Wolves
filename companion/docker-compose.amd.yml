# Arctic Wolves Video Companion Server - AMD GPU Override
# Use with: docker compose -f docker-compose.yml -f docker-compose.amd.yml up -d
#
# Enables AMD VA-API hardware-accelerated transcoding.  The entrypoint
# installs Mesa VA-API driver at container start based on the HW_ACCEL
# environment variable, so no build-args are required (works on TrueNAS
# and other platforms that only support environment variables).
#
# Prerequisites:
#   - AMD GPU (APU integrated or discrete Radeon)
#   - /dev/dri device nodes available on the host

services:
  companion:
    environment:
      - HW_ACCEL=vaapi
    devices:
      - /dev/dri:/dev/dri
