# Arctic Wolves Video Companion Server - Intel GPU Override
# Use with: docker compose -f docker-compose.yml -f docker-compose.intel.yml up -d
#
# Enables Intel Quick Sync Video (QSV) / VA-API hardware-accelerated
# transcoding.  The entrypoint installs Intel Media Driver (iHD) and VA-API
# libraries at container start based on the HW_ACCEL environment variable,
# so no build-args are required (works on TrueNAS and other platforms that
# only support environment variables).
#
# Prerequisites:
#   - Intel CPU with integrated graphics (HD/UHD/Iris/Arc)
#   - /dev/dri device nodes available on the host

services:
  companion:
    environment:
      - HW_ACCEL=qsv
    devices:
      - /dev/dri:/dev/dri
