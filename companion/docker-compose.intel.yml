# Arctic Wolves Video Companion Server - Intel GPU Override
# Use with: docker compose -f docker-compose.yml -f docker-compose.intel.yml up -d
#
# Uses the linuxserver.io Intel OpenCL mod for hardware-accelerated
# transcoding via Intel Quick Sync Video (QSV) / VA-API.
#
# Prerequisites:
#   - Intel CPU with integrated graphics (HD/UHD/Iris/Arc)
#   - /dev/dri device nodes available on the host
#
# Reference: https://github.com/linuxserver/docker-mods/tree/jellyfin-opencl-intel

services:
  companion:
    environment:
      - HW_ACCEL=qsv
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    devices:
      - /dev/dri:/dev/dri
