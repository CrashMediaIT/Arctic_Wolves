# Arctic Wolves Video Companion Server - TrueNAS Scale GPU Override
# Use with: docker compose -f docker-compose.yml -f docker-compose.truenas.yml up -d
#
# TrueNAS Scale GPU passthrough:
#   - Enable "Install NVIDIA Drivers" in Apps > Settings > Advanced Settings
#   - Assign the GPU to the container via the TrueNAS Scale UI or this compose file
#   - TrueNAS Scale uses `runtime: nvidia` for built-in Docker GPU passthrough

services:
  companion:
    runtime: nvidia
    environment:
      - HW_ACCEL=nvenc
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
