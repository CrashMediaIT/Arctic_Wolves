<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <!-- Hockey Goalie Ready Stance Silhouette -->
  <!-- Head/Goalie mask -->
  <circle cx="50" cy="11" r="9"/>
  <!-- Neck + Shoulders + Chest protector (single merged shape) -->
