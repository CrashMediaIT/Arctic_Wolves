<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor">
  <!-- Hockey Goalie - butterfly/ready stance, wide pads, blocker + glove -->
  <!-- Goalie mask / helmet (wider, with cage hint) -->
  <ellipse cx="256" cy="44" rx="40" ry="38"/>
  <rect x="288" y="28" width="18" height="26" rx="4" opacity="0.85"/>
  <!-- Neck -->
  <rect x="240" y="80" width="32" height="14" rx="4"/>
  <!-- Chest protector - wide and bulky -->
  <path d="M168,94 l176,0 l16,20 l-8,120 l-200,0 l-8,-120z"/>
  <!-- Left shoulder pad -->
  <path d="M168,94 l-28,8 l-8,36 l36,0z"/>
  <!-- Right shoulder pad -->
  <path d="M344,94 l28,8 l8,36 l-36,0z"/>
  <!-- Left arm to blocker -->
  <path d="M140,130 l-24,20 l-36,56 l-8,20 l24,0 l8,-20 l28,-44 l16,-18z"/>
  <!-- Blocker -->
  <rect x="52" y="218" width="40" height="56" rx="6"/>
  <!-- Right arm to glove -->
  <path d="M372,130 l24,20 l32,46 l-16,18 l-24,-10 l-24,-42 l-4,-18z"/>
  <!-- Glove/catcher - open and raised -->
  <path d="M408,190 c12,-8,28,-6,36,4 l10,20 c4,10,0,22,-10,28 l-24,10 c-10,4,-22,0,-28,-8 l-12,-22 c-4,-10,0,-22,10,-28z"/>
  <!-- Goalie stick - paddle style -->
  <rect x="56" y="268" width="14" height="160" rx="4"/>
  <!-- Stick blade/paddle (wider at bottom) -->
  <rect x="48" y="420" width="38" height="60" rx="4"/>
  <!-- Left leg pad - wide rectangular -->
  <path d="M172,232 l60,0 l8,8 l0,200 l-8,8 l-68,0 l-8,-8 l0,-200z"/>
  <!-- Right leg pad - wide rectangular -->
  <path d="M280,232 l60,0 l8,8 l0,200 l-8,8 l-68,0 l-8,-8 l0,-200z"/>
  <!-- Knee detail on pads -->
  <rect x="180" y="290" width="44" height="16" rx="4" opacity="0.3"/>
  <rect x="288" y="290" width="44" height="16" rx="4" opacity="0.3"/>
  <!-- Left skate blade -->
  <rect x="154" y="448" width="90" height="10" rx="3"/>
  <!-- Right skate blade -->
  <rect x="264" y="448" width="90" height="10" rx="3"/>
  <!-- Five-hole shadow (gap between pads) -->
  <rect x="232" y="280" width="48" height="160" rx="2" opacity="0.12"/>
</svg>
