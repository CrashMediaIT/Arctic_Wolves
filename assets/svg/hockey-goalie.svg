  <path d="M28,52 L44,52 L42,88 L24,88 Z"/>
  <!-- Right leg pad -->
  <path d="M56,52 L72,52 L76,88 L52,88 Z"/>
  <!-- Skate blades -->
  <rect x="20" y="88" width="26" height="4" rx="1"/>
  <rect x="48" y="88" width="32" height="4" rx="1"/>
  <!-- Goalie stick shaft -->
  <rect x="6" y="50" width="4" height="30" rx="1"/>
  <!-- Stick paddle -->
  <rect x="2" y="76" width="12" height="16" rx="2"/>
</svg>
