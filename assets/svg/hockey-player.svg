<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <!-- Hockey Player Skating Silhouette -->
  <!-- Head/Helmet -->
  <circle cx="48" cy="12" r="8"/>
  <!-- Helmet visor -->
  <rect x="53" y="9" width="5" height="4" rx="1"/>
  <!-- Neck + Torso - forward lean -->
  <path d="M42,20 L54,20 L58,24 L64,50 L34,50 L40,24 Z"/>
  <!-- Left arm reaching for stick -->
  <path d="M40,26 L26,40 L30,44 L44,32 Z"/>
  <!-- Right arm on stick -->
  <path d="M58,26 L68,40 L64,44 L54,32 Z"/>
  <!-- Stick shaft -->
  <rect x="16" y="40" width="58" height="4" rx="2" transform="rotate(-8 45 42)"/>
  <!-- Stick blade -->
  <path d="M70,36 L84,40 L82,48 L68,44 Z"/>
  <!-- Left leg (forward, bent) -->
  <path d="M36,50 L30,54 L18,78 L26,82 L42,58 Z"/>
  <!-- Right leg (back, extended) -->
  <path d="M52,50 L58,54 L76,76 L70,80 L50,58 Z"/>
  <!-- Left skate + blade -->
  <path d="M14,78 L26,82 L24,86 L10,84 Z"/>
  <rect x="8" y="85" width="20" height="3" rx="1"/>
  <!-- Right skate + blade -->
  <path d="M70,76 L80,80 L82,84 L68,82 Z"/>
  <rect x="66" y="83" width="20" height="3" rx="1"/>
</svg>
