<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor">
  <!-- Hockey Player Skating - forward lean, stick on ice, dynamic stride -->
  <!-- Helmet -->
  <ellipse cx="200" cy="52" rx="36" ry="34"/>
  <!-- Visor -->
  <path d="M228,42 l18,2 l2,16 l-16,0z"/>
  <!-- Neck into shoulders -->
  <path d="M178,82 l44,0 l12,8 l-68,0z"/>
  <!-- Torso - leaning forward aggressively -->
  <path d="M160,90 l80,0 l28,130 l-136,0z"/>
  <!-- Left arm (top hand on stick) reaching forward -->
  <path d="M162,100 l-16,12 l-56,68 l-10,18 l18,10 l12,-18 l48,-60 l16,-14z"/>
  <!-- Right arm (bottom hand on stick) -->
  <path d="M236,110 l14,10 l30,48 l10,18 l-18,10 l-12,-18 l-24,-42 l-12,-12z"/>
  <!-- Stick shaft - angled from hands down to ice -->
  <path d="M80,188 l12,-10 l210,170 l-4,16z"/>
  <!-- Stick blade on ice -->
  <path d="M298,364 l70,12 l4,20 l-74,-10z"/>
  <!-- Left leg - forward stride, knee bent -->
  <path d="M172,218 l36,4 l-24,92 l-46,102 l-28,-8 l38,-96 l10,-82z"/>
  <!-- Left skate -->
  <path d="M108,404 l32,10 l-6,16 l-42,-6 l-4,-14z"/>
  <!-- Left skate blade -->
  <path d="M86,426 l56,8 l0,10 l-60,-8z"/>
  <!-- Right leg - pushing back, extended -->
  <path d="M220,218 l36,-4 l62,102 l52,82 l-28,12 l-48,-78 l-56,-96z"/>
  <!-- Right skate -->
  <path d="M342,408 l28,-12 l14,12 l-8,16 l-40,2z"/>
  <!-- Right skate blade -->
  <path d="M334,424 l50,-2 l2,10 l-54,4z"/>
</svg>
