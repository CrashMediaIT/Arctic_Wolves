plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ca.arcticwolves.gameplan.tv'
    compileSdk 34

    defaultConfig {
        applicationId "ca.arcticwolves.gameplan.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Default server base URL (overridden per build type)
        buildConfigField "String", "BASE_URL", "\"https://gameplan.arcticwolves.ca\""
        buildConfigField "String", "API_BASE_URL", "\"https://api.arcticwolves.ca/v1\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", "\"http://10.0.2.2/Arctic_Wolves\""
            buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2/Arctic_Wolves/api/v1\""
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Android TV Leanback
    implementation 'androidx.leanback:leanback:1.0.0'

    // WebView (included in SDK, no extra dep needed)

    // OkHttp for REST API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON parsing
    implementation 'org.json:json:20231013'

    // Testing
    testImplementation 'junit:junit:4.13.2'
}
