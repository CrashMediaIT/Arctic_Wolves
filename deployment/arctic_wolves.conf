# NGINX Configuration for Arctic Wolves
# Optimized for PHP application with large video uploads
#
# NOTE: This configuration uses /config directory structure:
#   - Web root: /config/www/Arctic_Wolves
#   - NGINX files: /config/nginx/
#   - PHP socket: /config/php/php8.1-fpm.sock
#   - Logs: /config/log/
#   - SSL certificates: /config/nginx/ssl/
#
# Adjust paths if your system uses standard /var locations
#
# NOTE: gameplan.arcticwolves.ca is handled by a separate server block below.
# It reverse-proxies to the Video Companion Server (Python/Flask on port 5100).

# =============================================================================
# SSL OFFLOADING / REVERSE PROXY SUPPORT (pfSense HAProxy)
# =============================================================================
# When behind a TLS-terminating reverse proxy (e.g. pfSense HAProxy),
# trust the X-Forwarded-* headers so PHP can detect HTTPS correctly.
# Adjust the IP/range to match your HAProxy upstream address.
#
# set_real_ip_from 10.0.0.0/8;       # Adjust to your HAProxy subnet
# set_real_ip_from 172.16.0.0/12;
# set_real_ip_from 192.168.0.0/16;
# real_ip_header X-Forwarded-For;

# =============================================================================
# POS KIOSK SUBDOMAIN (pos.arcticwolves.ca)
# Dedicated subdomain for POS kiosk mode - redirects to POS PIN login
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    
    server_name pos.arcticwolves.ca;
    
    # Document root - same as main site
    root /config/www/Arctic_Wolves;
    index pos_kiosk.php index.php;
    
    # Minimal file upload for POS
    client_max_body_size 10M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /config/log/arctic_wolves_pos_access.log;
    error_log /config/log/arctic_wolves_pos_error.log;
    
    # Hide NGINX version
    server_tokens off;
    
    # Root location - redirect to POS kiosk
    location = / {
        return 302 /pos_kiosk.php;
    }
    
    # Default location for PHP files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pass SSL offloading proxy header so PHP detects HTTPS (pfSense HAProxy)
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to configuration files
    location ~ \.(env|sql)$ {
        deny all;
        return 404;
    }
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# =============================================================================
# API SUBDOMAIN (api.arcticwolves.ca)
# REST API for external applications (Game Plan, ACWolvesAPP)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    
    server_name api.arcticwolves.ca;
    
    # Document root - API directory
    root /config/www/Arctic_Wolves/api;
    index index.php;
    
    # Moderate upload size for API requests
    client_max_body_size 100M;
    client_body_timeout 120s;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CORS headers for external app access
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
    add_header Access-Control-Max-Age "86400" always;
    
    # Logging
    access_log /config/log/arctic_wolves_api_access.log;
    error_log /config/log/arctic_wolves_api_error.log;
    
    # Hide NGINX version
    server_tokens off;
    
    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    
    # Route all requests through the API index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pass SSL offloading proxy header so PHP detects HTTPS (pfSense HAProxy)
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to configuration files
    location ~ \.(env|sql|md|sh)$ {
        deny all;
        return 404;
    }
}

# =============================================================================
# MAIN SITE (arcticwolves.ca / www.arcticwolves.ca)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    
    # Replace with your domain name
    server_name arcticwolves.ca www.arcticwolves.ca;
    
    # Document root
    root /config/www/Arctic_Wolves;
    index index.php index.html;
    
    # Large file upload support for videos (10GB limit)
    client_max_body_size 10G;             # Maximum upload size (10GB for large videos)
    client_body_timeout 600s;             # Timeout for client body (10 minutes)
    client_header_timeout 600s;           # Timeout for client header
    proxy_read_timeout 600s;              # Timeout for reading response
    fastcgi_read_timeout 600s;            # PHP-FPM timeout (10 minutes)
    
    # Buffer settings for large uploads
    client_body_buffer_size 256k;         # Buffer size for client body
    client_body_temp_path /config/nginx/client_body_temp;
    
    # Security headers (aligned with application)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (aligned with security.php)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://maps.googleapis.com https://maps.gstatic.com https://places.googleapis.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' wss: https://maps.googleapis.com https://places.googleapis.com; frame-ancestors 'self';" always;
    
    # Logging
    access_log /config/log/arctic_wolves_access.log;
    error_log /config/log/arctic_wolves_error.log;
    
    # Hide NGINX version
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # Default location for PHP files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM configuration for linuxserver/nginx Docker
    location ~ \.php$ {
        # Security: Don't process non-existent files
        try_files $uri =404;
        
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;  # linuxserver uses TCP, not Unix socket
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pass SSL offloading proxy header so PHP detects HTTPS (pfSense HAProxy)
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        
        # Large file upload timeouts for PHP (matches global timeout)
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        
        # Buffer settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to setup.php after initial setup
    # Uncomment after completing setup
    # location = /setup.php {
    #     deny all;
    #     return 404;
    # }
    
    # Deny access to configuration and environment files
    # This protects .env and .sql files in ALL directories, including QA and deployment
    location ~ \.(env|sql)$ {
        deny all;
        return 404;
    }
    
    # Allow access to QA and deployment documentation directories
    # Only allows .md, .txt, and .json files (.sql already denied above)
    location ~ ^/(QA|deployment)/.*\.(md|txt|json)$ {
        add_header Content-Type "text/plain; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Video files with extended cache
    location ~* \.(mp4|webm|ogg|avi|mov)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        
        # Enable range requests for video streaming
        add_header Accept-Ranges bytes;
    }
    
    # Deny access to backup files
    location ~ \.(bak|backup|sql|old|tmp)$ {
        deny all;
        return 404;
    }
    
    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}

# =============================================================================
# GAME PLAN SUBDOMAIN (gameplan.arcticwolves.ca)
# Dedicated subdomain for the Game Plan video review interface.
# Follows the same pattern as POS - serves PHP from the same document root.
# The companion server (video encoding) is accessed via PHP backend (curl),
# not through an nginx reverse proxy.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    
    server_name gameplan.arcticwolves.ca;
    
    # Document root - same as main site
    root /config/www/Arctic_Wolves;
    index gameplan.php index.php;
    
    # Large file upload support for videos (2GB limit)
    client_max_body_size 2G;
    client_body_timeout 600s;
    client_header_timeout 600s;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /config/log/gameplan_access.log;
    error_log /config/log/gameplan_error.log;
    
    # Hide NGINX version
    server_tokens off;
    
    # Root location - redirect to Game Plan
    location = / {
        return 302 /gameplan.php;
    }
    
    # Default location for PHP files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pass SSL offloading proxy header so PHP detects HTTPS (pfSense HAProxy)
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to configuration files
    location ~ \.(env|sql)$ {
        deny all;
        return 404;
    }
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Video files with extended cache
    location ~* \.(mp4|webm|ogg|avi|mov)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        
        # Enable range requests for video streaming
        add_header Accept-Ranges bytes;
    }
}

