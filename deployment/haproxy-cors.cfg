# =========================
# CORS (pfSense HAProxy)
# Supports ArcticWolves + existing domains
# =========================
#
# IMPORTANT: Access-Control-Expose-Headers MUST include "ETag" so the browser
# can read the ETag response header from S3/RustFS multipart upload part
# responses.  Without it, CompleteMultipartUpload will fail because the
# JavaScript cannot collect part ETags.
#
# Paste these rules into pfSense → HAProxy → Backend / Frontend
# "Advanced pass thru" text area.

# Capture Origin
http-request set-var(txn.origin) req.hdr(Origin)

# Allow listed domains (http/https, optional subdomains, optional port)
acl cors_allowed var(txn.origin) -m reg -i ^https?://([a-z0-9-]+\.)*(precisionflooring\.ca|crashmedia\.ca|crashcrafts\.com|arcticwolves\.ca)(:[0-9]{1,5})?$

# ---- Preflight (OPTIONS) ----
# Return 204 only when OPTIONS AND origin is allowed
http-request return status 204 hdr Access-Control-Allow-Origin "%[var(txn.origin)]" hdr Access-Control-Allow-Credentials "true" hdr Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" hdr Access-Control-Allow-Headers "x-api-key, Authorization, Content-Type, Accept, Range" hdr Access-Control-Max-Age "86400" hdr Vary "Origin" if METH_OPTIONS cors_allowed

# ---- Normal responses ----
http-response set-header Access-Control-Allow-Origin "%[var(txn.origin)]" if cors_allowed
http-response set-header Access-Control-Allow-Credentials "true" if cors_allowed
http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" if cors_allowed
http-response set-header Access-Control-Allow-Headers "x-api-key, Authorization, Content-Type, Accept, Range" if cors_allowed
http-response set-header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, ETag" if cors_allowed
http-response set-header Vary "Origin" if cors_allowed
