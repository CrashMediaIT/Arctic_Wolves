name: Build Scoreboard Viewer APK

on:
  push:
    paths:
      - 'scoreboard-viewer/**'
  pull_request:
    paths:
      - 'scoreboard-viewer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoreboard-viewer

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-viewer-debug
          path: scoreboard-viewer/app/build/outputs/apk/debug/app-debug.apk
